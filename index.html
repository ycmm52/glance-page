<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glance Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: #1e1e2e;
            color: #cdd6f4;
        }
        h1 { color: #89b4fa; border-bottom: 1px solid #45475a; padding-bottom: 0.5rem; }
        .card {
            background: #313244;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1rem 0;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        a {
            color: #89b4fa;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        .status {
            display: inline-block;
            background: #a6e3a1;
            color: #1e1e2e;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <h1>Glance Dashboard</h1>
    <p><span class="status">Live on GitHub Pages</span></p>
    <div class="card">
        <h2>Links</h2>
        <ul>
            <li><a href="#">Coming soon...</a></li>
        </ul>
    </div>
</body>
</html>
